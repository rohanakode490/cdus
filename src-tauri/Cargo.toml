[package]
name = "tauri-app"
version = "0.2.0"
description = "CDUS Desktop Application"
authors = ["CDUS Team"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde_json = "1"
cdus-common = { path = "../crates/cdus-common" }
interprocess = "1.2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
arboard = "3.4"



