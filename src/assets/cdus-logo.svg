<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep elevated surface with radial cyan ambient glow -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#192528" />
      <stop offset="70%" stop-color="#121618" />
      <stop offset="100%" stop-color="#0E1213" />
    </radialGradient>

    <!-- Vibrant Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#24C8DB" />
      <stop offset="100%" stop-color="#00838F" />
    </linearGradient>

    <!-- Screen Contrast Glass -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1A1D" />
      <stop offset="100%" stop-color="#060E10" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Mobile Drop Shadow -->
    <filter id="phoneShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="-10" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Base Squircle Container with High-Contrast Luminous Cyan Border -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)" stroke="#24C8DB" stroke-width="12" stroke-opacity="0.85" />
  <!-- Subtle Inner Edge Light -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="none" stroke="#4DD0E1" stroke-width="2" stroke-opacity="0.3" />

  <!-- ==================== DESKTOP MONITOR ==================== -->
  <!-- Stand Base -->
  <rect x="165" y="365" width="130" height="16" rx="8" fill="#24C8DB" opacity="0.9" />
  <!-- Stand Neck -->
  <path d="M 218 318 L 242 318 L 238 365 L 222 365 Z" fill="#182326" stroke="#24C8DB" stroke-width="4" />

  <!-- Monitor Frame -->
  <rect x="85" y="115" width="285" height="205" rx="22" fill="#162023" stroke="#24C8DB" stroke-width="8" />
  <!-- Monitor Screen -->
  <rect x="99" y="129" width="257" height="177" rx="14" fill="url(#screenGrad)" stroke="#00363A" stroke-width="2" />

  <!-- Chrome Dots -->
  <circle cx="118" cy="147" r="4.5" fill="#EF4444" opacity="0.9" />
  <circle cx="134" cy="147" r="4.5" fill="#F59E0B" opacity="0.9" />
  <circle cx="150" cy="147" r="4.5" fill="#10B981" opacity="0.9" />

  <!-- Screen Code Lines -->
  <line x1="118" y1="172" x2="195" y2="172" stroke="#4DD0E1" stroke-width="6" stroke-linecap="round" opacity="0.7" />
  <line x1="118" y1="192" x2="165" y2="192" stroke="#24C8DB" stroke-width="6" stroke-linecap="round" opacity="0.5" />
  <line x1="118" y1="212" x2="205" y2="212" stroke="#00838F" stroke-width="6" stroke-linecap="round" opacity="0.4" />

  <!-- ==================== SYNC BRIDGE ==================== -->
  <!-- Glowing Connection Conduit -->
  <path d="M 220 230 C 285 230, 275 285, 345 285" fill="none" stroke="url(#cyanGrad)" stroke-width="22" stroke-linecap="round" filter="url(#cyanGlow)" />
  <path d="M 220 230 C 285 230, 275 285, 345 285" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.95" />

  <!-- ==================== MOBILE PHONE ==================== -->
  <g filter="url(#phoneShadow)">
    <!-- Phone Outer Body -->
    <rect x="282" y="165" width="145" height="245" rx="30" fill="#162023" stroke="#4DD0E1" stroke-width="9" />
    <!-- Phone Screen -->
    <rect x="295" y="178" width="119" height="219" rx="22" fill="url(#screenGrad)" stroke="#24C8DB" stroke-width="2" />

    <!-- Speaker Pill -->
    <rect x="338" y="188" width="34" height="6" rx="3" fill="#24C8DB" opacity="0.7" />

    <!-- Phone Card Preview -->
    <rect x="307" y="208" width="95" height="38" rx="8" fill="#1C282C" stroke="#24C8DB" stroke-width="2" stroke-opacity="0.6" />
    <circle cx="322" cy="227" r="6" fill="#24C8DB" />
    <line x1="336" y1="223" x2="388" y2="223" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <line x1="336" y1="231" x2="370" y2="231" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" opacity="0.7" />

    <!-- Home Indicator -->
    <rect x="340" y="388" width="30" height="4" rx="2" fill="#24C8DB" opacity="0.6" />
  </g>

  <!-- ==================== SYNCHRONIZED NODES ==================== -->
  <!-- Desktop Node -->
  <circle cx="220" cy="230" r="16" fill="#24C8DB" filter="url(#cyanGlow)" />
  <circle cx="220" cy="230" r="8" fill="#FFFFFF" />

  <!-- Central Nexus Pulse -->
  <g filter="url(#cyanGlow)">
    <circle cx="282" cy="257" r="15" fill="#00E5FF" />
    <circle cx="282" cy="257" r="7" fill="#FFFFFF" />
    <circle cx="282" cy="257" r="26" fill="none" stroke="#24C8DB" stroke-width="3.5" stroke-dasharray="6 5" opacity="0.8" />
  </g>

  <!-- Mobile Node -->
  <circle cx="345" cy="285" r="16" fill="#24C8DB" filter="url(#cyanGlow)" />
  <circle cx="345" cy="285" r="8" fill="#FFFFFF" />
</svg>