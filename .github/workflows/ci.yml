name: CDUS CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. RUST CORE & FFI VALIDATION
  # =========================================================================
  rust-validation:
    name: Rust Core (Fmt, Clippy, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: "rust-core"

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features

      - name: Run Tests
        run: cargo test --workspace --exclude tauri-app

  # =========================================================================
  # 2. GO RELAY VALIDATION & DEPLOYMENT
  # =========================================================================
  go-relay:
    name: Go Relay (Fmt, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: relay/go.sum

      - name: Check Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted. Run gofmt."
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build Binary
        run: go build -o cdus-relay ./cmd/cdus-relay

      # CD deployment step to Hugging Face Spaces (only on main branch push)
      - name: Deploy to Hugging Face Spaces
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Use Git to push to Hugging Face space repository if HF_TOKEN is configured
          if [ -z "$HF_TOKEN" ]; then
            echo "Skipping deployment: HF_TOKEN not set."
            exit 0
          fi
          git config --global user.email "ci-bot@cdus.io"
          git config --global user.name "CDUS CI Bot"
          git remote add hf https://user:$HF_TOKEN@huggingface.co/spaces/rohanakode/cdus-relay
          git push -f hf main:main

  # =========================================================================
  # 3. ANDROID SHELL BUILDER
  # =========================================================================
  android-build:
    name: Android App (Gradle, UniFFI, NDK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: "android-rust"

      - name: Set up Android NDK & SDK
        uses: android-actions/setup-android@v3

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Generate Kotlin bindings & Native libs
        run: |
          chmod +x sync-ffi.sh
          ./sync-ffi.sh

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Run Kotlin Linter / Checks
        run: |
          cd android
          ./gradlew lintDebug --continue

      - name: Run Android Unit Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cdus-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # =========================================================================
  # 4. TAURI DESKTOP BUILDER (LINUX FIRST)
  # =========================================================================
  tauri-desktop:
    name: Tauri Desktop (Linux Build Verification)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Bun (Frontend Package Manager)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: "tauri-rust"

      - name: Verify TypeScript & Build Frontend
        run: bun run build

      - name: Build Tauri Desktop (No-Bundle Check)
        run: bun run tauri build --no-bundle
