<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="favBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#18272A" />
      <stop offset="100%" stop-color="#0B1214" />
    </radialGradient>
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#24C8DB" />
    </linearGradient>
  </defs>

  <!-- High-Contrast Squircle Badge for Browser Tabs -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#favBg)" stroke="#00E5FF" stroke-width="24" />

  <!-- Desktop Monitor Outline (High Visibility) -->
  <rect x="75" y="105" width="245" height="185" rx="24" fill="#141E20" stroke="#24C8DB" stroke-width="20" />
  <rect x="150" y="325" width="95" height="20" rx="10" fill="#24C8DB" />
  <path d="M 187 290 L 208 290 L 204 325 L 191 325 Z" fill="#24C8DB" />

  <!-- Mobile Phone Outline (Crisp Foreground White & Cyan) -->
  <rect x="250" y="160" width="175" height="250" rx="34" fill="#0E1618" stroke="#FFFFFF" stroke-width="20" />
  <rect x="310" y="180" width="55" height="10" rx="5" fill="#24C8DB" />

  <!-- Synchronized Conduit (Bold High-Luminance Bridge) -->
  <path d="M 195 210 C 260 210, 250 285, 335 285" fill="none" stroke="url(#favCyan)" stroke-width="34" stroke-linecap="round" />
  <path d="M 195 210 C 260 210, 250 285, 335 285" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />

  <!-- Pulse Nodes with White Cores -->
  <circle cx="195" cy="210" r="24" fill="#00E5FF" />
  <circle cx="195" cy="210" r="12" fill="#FFFFFF" />

  <circle cx="265" cy="248" r="22" fill="#FFFFFF" />
  <circle cx="265" cy="248" r="12" fill="#00E5FF" />

  <circle cx="335" cy="285" r="24" fill="#00E5FF" />
  <circle cx="335" cy="285" r="12" fill="#FFFFFF" />
</svg>